<!DOCTYPE html>
<html>
  <head>
    <title>Sprite Add Test</title>
    <style>
      body {
        background-color: white;
      }
      .container {
        display: flex;
        gap: 1rem;
        justify-content: flex-start;
        flex-wrap: wrap;
        flex-direction: row;
      }
      .panel {
        border: 1px solid #ddd;
        border-radius: 1rem;
        padding: 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        align-items: center;
      }
      .toolbar {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        margin-bottom: 1rem;
      }
      .panel button {
        padding: 0.4rem;
        border: 1px solid #ddd;
        border-radius: 0.5rem;
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <label for="channel">Channel</label>
      <input type="text" id="channel" value="frampersand" />
      <span id="admin-status">Connecting…</span>
    </div>
    <div class="container">
      <div class="panel">
        <label for="sprite">Sprite</label>
        <input type="text" name="sprite" id="sprite" />
        <button id="sprite-btn">Send</button>
      </div>
      <div class="panel">
        <label for="color">Background color</label>
        <input type="text" name="color" id="color" />
        <button id="color-btn">Send</button>
      </div>
      <div class="panel">
        <label for="pattern">Pattern</label>
        <input type="text" name="" id="pattern" />
        <button id="pattern-btn">Send</button>
      </div>
      <div class="panel">
        <label for="randomize">Randomize</label>
        <button id="randomize-btn">Activate</button>
      </div>
      <div class="panel">
        <label for="randomize">Rain</label>
        <button id="rain-btn">Activate</button>
      </div>
      <div class="panel">
        <label for="randomize">PMD Portrait</label>
        <input type="text" name="" id="pmd-message" />
        <button id="pmd-portrait-btn">Activate</button>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      // Admin events need ADMIN_TOKEN. Open as /admin/#token=... or enter it when prompted.
      function getAdminToken() {
        var fromHash = new URLSearchParams(location.hash.slice(1)).get("token");
        if (fromHash) {
          history.replaceState(null, "", location.pathname + location.search);
        }
        var stored = null;
        try { stored = sessionStorage.getItem("adminToken"); } catch (e) {}
        var token = fromHash || stored || window.prompt("Admin token") || "";
        try { sessionStorage.setItem("adminToken", token); } catch (e) {}
        return token;
      }

      var socket = io({ auth: { token: getAdminToken() } });

      socket.on("admin-status", function (isAdmin) {
        document.getElementById("admin-status").textContent = isAdmin
          ? "Admin token accepted"
          : "Admin token rejected: reload and enter the right one";
        if (!isAdmin) {
          try { sessionStorage.removeItem("adminToken"); } catch (e) {}
        }
      });

      // Target channel for every trigger; the server ignores channels the bot hasn't joined
      function channel() {
        return "#" + document.getElementById("channel").value.trim().replace(/^#/, "").toLowerCase();
      }

      document
        .getElementById("sprite-btn")
        .addEventListener("click", function () {
          const numberTextbox = document.getElementById("sprite");
          const number = numberTextbox.value
            ? numberTextbox.value
            : Math.floor(Math.random() * (800 - 0 + 1) + 0);
          socket.emit("sprite-number", number, channel());
        });

      document
        .getElementById("color-btn")
        .addEventListener("click", function () {
          const numberTextbox = document.getElementById("color");
          const number = numberTextbox.value;
          socket.emit("color", number, channel());
        });

      document
        .getElementById("pattern-btn")
        .addEventListener("click", function () {
          const numberTextbox = document.getElementById("pattern");
          const number = numberTextbox.value;
          socket.emit("pattern", number, channel());
        });

      document
        .getElementById("randomize-btn")
        .addEventListener("click", function () {
          socket.emit("randomize", "Frampersand", channel());
        });

      document
        .getElementById("rain-btn")
        .addEventListener("click", function () {
          socket.emit("rain", channel());
        });

      document
        .getElementById("pmd-portrait-btn")
        .addEventListener("click", function () {
          const messageTextbox = document.getElementById("pmd-message");
          const message = messageTextbox.value;
          socket.emit("pmd-portrait", "Frampersand", message, channel());
        });
    </script>
  </body>
</html>

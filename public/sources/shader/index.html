<!DOCTYPE html>
<html>
<head>
  <title>FramperBot OBS Source - background</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background-color: transparent;
    }
    #scene-stage {
      position: fixed;
      inset: 0;
    }
    .scene-layer {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 1.5s ease;
    }
    .scene-layer.visible {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div id="scene-stage"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="../../libs/tinycolor/tinycolor.js"></script>
  <script type="module" src="listener.js"></script>
</body>
</html>
